version: '3.8'

services:
  db:
    image: postgres:15
    container_name: arguschain_db
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: arguspassword
      POSTGRES_DB: arguschain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
